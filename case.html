<style>

/* ===== リセット ===== */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:#fff;
  color:#000;
}

/* ===== 画像 ===== */

img{
  width:100%;
  height:auto;
  display:block;
}

/* ===== リンク ===== */

a{
  display:block;
  line-height:0;
  transition:opacity .25s;
}

@media (hover:hover){
  a:hover{
    opacity:0.8;
  }
}

/* ===== グリッド（PC） ===== */

.case-row{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:12px;
  max-width:1000px;
  margin:0 auto;
  padding:0 10px;
}

/* ===== スマホ ===== */

@media (max-width:768px){
  .case-row{
    grid-template-columns:1fr;
  }
}

/* ===== フッター ===== */

footer{
  margin-top:40px;
}

</style>
</head>
